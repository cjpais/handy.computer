name: Update Handy version

on:
  schedule:
    # Run daily at 06:17 UTC. A non-round time reduces scheduler congestion.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-handy-version
  cancel-in-progress: false

jobs:
  update:
    name: Update website to latest release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Find latest Handy release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/cjpais/handy/releases/latest > "$RUNNER_TEMP/release.json"

          tag="$(jq -r '.tag_name' "$RUNNER_TEMP/release.json")"
          version="${tag#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected release tag: $tag" >&2
            exit 1
          fi

          current="$(sed -n 's/^export const VERSION = "\([^"]*\)";$/\1/p' src/config/downloads.ts)"
          if [[ -z "$current" ]]; then
            echo "Could not read the current version from src/config/downloads.ts" >&2
            exit 1
          fi

          echo "Latest release: $tag (website: v$current)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [[ "$version" == "$current" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify release assets
        if: steps.release.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          jq -r '.assets[].name' "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/assets.txt"

          expected_assets=(
            "Handy_${VERSION}_aarch64.dmg"
            "Handy_${VERSION}_x64.dmg"
            "Handy_${VERSION}_x64-setup.exe"
            "Handy_${VERSION}_x64_en-US.msi"
            "Handy_${VERSION}_arm64-setup.exe"
            "Handy_${VERSION}_arm64_en-US.msi"
            "Handy_${VERSION}_amd64.AppImage"
            "Handy_${VERSION}_amd64.deb"
            "Handy-${VERSION}-1.x86_64.rpm"
            "Handy_${VERSION}_aarch64.AppImage"
            "Handy_${VERSION}_arm64.deb"
            "Handy-${VERSION}-1.aarch64.rpm"
          )

          for asset in "${expected_assets[@]}"; do
            if ! grep -Fxq "$asset" "$RUNNER_TEMP/assets.txt"; then
              echo "Latest release is missing expected asset: $asset" >&2
              exit 1
            fi
          done

      - name: Update version
        if: steps.release.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("src/config/downloads.ts")
          contents = path.read_text()
          updated, count = re.subn(
              r'^export const VERSION = "[^"]+";$',
              f'export const VERSION = "{os.environ["VERSION"]}";',
              contents,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("Expected to update exactly one VERSION declaration")
          path.write_text(updated)
          PY

      - name: Set up Bun
        if: steps.release.outputs.changed == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Build website
        if: steps.release.outputs.changed == 'true'
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Commit and push update
        if: steps.release.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/config/downloads.ts
          git commit -m "chore: update Handy to v${VERSION}"
          git push
